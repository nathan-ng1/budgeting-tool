[project]
name = "budgeting-tool"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# mcp-google-sheets 0.6.3 declares `mcp>=1.8.0` with no upper bound, but breaks
# against the real mcp 2.0.0 (mcp.server.fastmcp was restructured away) — pin below 2.0.
mcp = ["mcp-google-sheets==0.6.3", "mcp<2.0.0"]

[dependency-groups]
dev = ["pytest>=8"]
# Compiles the Retail Edition (Issue #252). zstandard and ordered-set make Nuitka faster and its output smaller.
retail-build = ["nuitka==2.8.10", "zstandard", "ordered-set"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
